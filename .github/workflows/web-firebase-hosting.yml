name: Deploy web to Firebase Hosting

on:
  push:
    branches:
      - production
    paths:
      - "web/**"
      - ".github/workflows/web-firebase-hosting.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      VITE_API_BASE_URL: https://sahakar-bharathi-api.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify build output
        run: test -f dist/index.html
      - name: Require Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SAHAKARBHARATI_E3B04 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing GitHub secret FIREBASE_SERVICE_ACCOUNT_SAHAKARBHARATI_E3B04"
            exit 1
          fi
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SAHAKARBHARATI_E3B04 }}
          channelId: live
          projectId: sahakarbharati-e3b04
          entryPoint: web
