name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secrets-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked files for secrets
        run: bash scripts/check-secrets.sh
  source-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build and check source archive
        run: |
          zip="$(bash scripts/build-source-archive.sh | tail -n1)"
          bash scripts/check-archive.sh "$zip"
