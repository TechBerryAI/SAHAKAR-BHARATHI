name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secrets-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked files for secrets
        run: bash scripts/check-secrets.sh
