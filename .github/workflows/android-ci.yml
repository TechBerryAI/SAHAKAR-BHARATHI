name: Android CI

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:
    inputs:
      signed_release:
        description: "Build a signed release AAB/APK (requires the android-release environment)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}-${{ inputs.signed_release || false }}
  cancel-in-progress: true

env:
  # Public API origin, not a secret. Release builds fail for http://, localhost or placeholders.
  SAHAKAR_API_BASE_URL: https://sahakar-bharathi-api.onrender.com/

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Debug build
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Release build guard rejects a missing API URL
        run: |
          if SAHAKAR_API_BASE_URL= ./gradlew --no-daemon -q :app:validateReleaseConfig; then
            echo "validateReleaseConfig accepted an empty API URL"; exit 1
          fi
      - name: Unsigned release build (R8)
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/
          retention-days: 7

  signed-release:
    # Manual only, behind the protected android-release environment (required reviewers).
    if: github.event_name == 'workflow_dispatch' && inputs.signed_release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: android-release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Missing secret ANDROID_KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
      - name: Signed release build
        env:
          SAHAKAR_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          SAHAKAR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SAHAKAR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SAHAKAR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SAHAKAR_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon :app:bundleRelease :app:assembleRelease
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android-signed-release-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
