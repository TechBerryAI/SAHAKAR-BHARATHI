name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "render.yaml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "render.yaml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sahakar
          POSTGRES_PASSWORD: sahakar
          POSTGRES_DB: sahakar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: development
      TEST_DATABASE_URL: postgresql+psycopg://sahakar:sahakar@localhost:5432/sahakar_test
      POSTGRES_HOST: localhost
      POSTGRES_USER: sahakar
      POSTGRES_PASSWORD: sahakar
      POSTGRES_TEST_DB: sahakar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+psycopg://sahakar:sahakar@localhost:5432/sahakar_test
        run: alembic upgrade head
      - name: Test
        run: pytest
      - name: Lint
        run: ruff check
