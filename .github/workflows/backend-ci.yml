name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "infra/supabase/**"
      - ".github/workflows/backend-ci.yml"
      - "render.yaml"
  pull_request:
    paths:
      - "backend/**"
      - "infra/supabase/**"
      - ".github/workflows/backend-ci.yml"
      - "render.yaml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Disposable CI database. Matches the Supabase major version in docs/DATABASE.md.
        image: postgres:16
        env:
          POSTGRES_USER: sahakar
          POSTGRES_PASSWORD: sahakar
          POSTGRES_DB: sahakar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: development
      TEST_DATABASE_URL: postgresql+psycopg://sahakar:sahakar@localhost:5432/sahakar_test
      POSTGRES_HOST: localhost
      POSTGRES_USER: sahakar
      POSTGRES_PASSWORD: sahakar
      POSTGRES_TEST_DB: sahakar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Apply migrations to an empty database
        env:
          DATABASE_URL: postgresql+psycopg://sahakar:sahakar@localhost:5432/sahakar_test
        run: alembic upgrade head
      - name: Test (includes fresh-database, schema.sql parity and Supabase role checks)
        run: pytest -rs
      - name: Lint
        run: ruff check

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked files for secrets
        run: bash scripts/check-secrets.sh
