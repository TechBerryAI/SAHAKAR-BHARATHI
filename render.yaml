# Render Blueprint for the FastAPI service. Secrets use `sync: false` and are
# entered in the Render dashboard; never commit their values. See docs/DEPLOYMENT.md.
services:
  - type: web
    name: sahakar-bharati-api
    runtime: python
    rootDir: backend
    buildCommand: pip install .
    # One Uvicorn worker. With RATE_LIMIT_BACKEND=memory the service must also
    # run a single instance; switch to postgres before scaling out.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://sahakarbharati-e3b04.web.app,https://sahakarbharati-e3b04.firebaseapp.com
      - key: RATE_LIMIT_BACKEND
        value: memory
      # OTP SMS delivery (Textbee). Registration cannot complete without it.
      - key: TEXTBEE_API_KEY
        sync: false
      - key: TEXTBEE_DEVICE_ID
        sync: false
