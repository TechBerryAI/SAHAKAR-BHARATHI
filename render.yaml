# Render Blueprint for the FastAPI service. Secrets use `sync: false` and are
# entered in the Render dashboard; never commit their values. See docs/DEPLOYMENT.md.
services:
  - type: web
    name: sahakar-bharati-api
    runtime: python
    rootDir: backend
    buildCommand: pip install .
    # One Uvicorn worker. Production startup requires RATE_LIMIT_BACKEND=postgres
    # so every instance shares rate_limit_buckets. memory is development only.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://sahakarbharati-e3b04.web.app,https://sahakarbharati-e3b04.firebaseapp.com
      - key: RATE_LIMIT_BACKEND
        value: postgres
      # Cloudflare sets CF-Connecting-IP and overwrites a caller-supplied value.
      # X-Forwarded-For is not used. See docs/DEPLOYMENT.md.
      - key: CLIENT_IP_SOURCE
        value: cf-connecting-ip
      # OTP SMS delivery (Textbee). Registration cannot complete without it.
      - key: TEXTBEE_API_KEY
        sync: false
      - key: TEXTBEE_DEVICE_ID
        sync: false
      - key: COUNTER_GEOFENCE_MODE
        value: required
      - key: COUNTER_GEOFENCE_RADIUS_M
        value: "150"
      - key: COUNTER_SCAN_MAX_ACCURACY_M
        value: "100"
      - key: COUNTER_SCAN_LOCATION_MAX_AGE_SECONDS
        value: "120"
      - key: POSITION_MAX_AGE_SECONDS
        value: "21600"
      - key: POSITION_BATCH_MAX
        value: "50"
      - key: POSITION_BATCH_RATE_LIMIT
        value: "6"
      - key: POSITION_INVALID_RATE_LIMIT
        value: "30"
      - key: RATE_LIMIT_POOL_SIZE
        value: "2"
      - key: RATE_LIMIT_MAX_OVERFLOW
        value: "2"
      - key: RATE_LIMIT_POOL_TIMEOUT_SECONDS
        value: "5"
      - key: DOCUMENT_STORAGE_BACKEND
        sync: false
      - key: DOCUMENT_STORAGE_BUCKET
        sync: false
      - key: DOCUMENT_STORAGE_ACCESS_KEY
        sync: false
      - key: DOCUMENT_STORAGE_SECRET_KEY
        sync: false

  # Daily retention. DATABASE_URL must be the runtime role, the same value as
  # the web service, not the migration owner. The command is idempotent and
  # does not delete audit_events. See docs/DATABASE.md.
  - type: cron
    name: sahakar-bharati-retention
    runtime: python
    rootDir: backend
    schedule: "15 2 * * *"
    buildCommand: pip install .
    startCommand: python -m app.core.retention
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: POSITION_RETENTION_DAYS
        value: "30"
