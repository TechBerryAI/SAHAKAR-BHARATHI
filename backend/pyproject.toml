[project]
name = "sahakar-bharati-backend"
version = "0.1.0"
description = "Sahakar Bharati participant API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6,<0.120",
    "uvicorn[standard]>=0.34.0,<0.35",
    "sqlalchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2.3,<3.3",
    "alembic>=1.14.1,<1.16",
    "pydantic>=2.10.4,<3",
    "pydantic-settings>=2.7.1,<3",
    "email-validator>=2.2.0,<3",
    "pwdlib[argon2]>=0.2.1,<0.3",
    "python-dotenv>=1.0.1,<2",
    "httpx>=0.28.1,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4,<9",
    "httpx>=0.28.1,<0.29",
    "ruff>=0.9.0,<0.15",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
